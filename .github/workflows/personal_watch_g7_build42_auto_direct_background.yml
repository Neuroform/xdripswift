name: Personal xDrip G7 Watch Build 42
run-name: G7 Watch Build 42 Functional Baseline (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/personal_watch_g7_build42_auto_direct_background.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 42
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout historical source one final time
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: c4a3c3ff2ef117f350d91795b2154cc5191b36b1
          token: ${{ secrets.GH_PAT }}

      - name: Checkout current Build 42 patch scripts
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}
          path: _build42_patches

      - name: Materialize complete functional state through Build 37
        run: |
          set -euo pipefail
          P="_build42_patches/.github/scripts"
          python3 "$P/apply_personal_watch_phase1.py"
          python3 "$P/apply_g7_watch_ble_diagnostic.py"
          python3 "$P/apply_g7_watch_auth_probe_and_stale_safety.py"
          python3 "$P/apply_g7_watch_auth_telemetry.py"
          python3 "$P/apply_g7_watch_build11_discovery.py"
          python3 "$P/apply_g7_watch_build12_multiwindow.py"
          python3 "$P/apply_g7_watch_build13_notify_listener.py"
          python3 "$P/apply_g7_watch_build14_passive_decoder.py"
          python3 "$P/apply_g7_watch_build15_multicycle_validation.py"
          python3 "$P/apply_g7_watch_build16_complication_refresh.py"
          python3 "$P/apply_g7_watch_build16_compile_fixes.py"
          python3 "$P/apply_g7_watch_build17_ultra_layout.py"
          python3 "$P/apply_g7_watch_build18_ultra_fullarea.py"
          python3 "$P/apply_g7_watch_build34_graph_only.py"
          python3 "$P/apply_g7_watch_build36_final_widgets.py"
          python3 "$P/apply_g7_watch_build37_minute_tick_bezel.py"

      - name: Add lifecycle trace without disabling working functions
        run: |
          set -euo pipefail
          python3 _build42_patches/.github/scripts/apply_g7_watch_build41_ble_lifecycle_trace.py

      - name: Restore proven Direct-G7 function for permanent baseline
        run: |
          set -euo pipefail
          python3 _build42_patches/.github/scripts/apply_g7_watch_build42_reenable_auto_direct.py

      - name: Verify permanent Build 42 functional contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          state = Path('xDrip Watch App/DataModels/WatchStateModel.swift').read_text(encoding='utf-8')
          plist = Path('xDrip-Watch-App-Info.plist').read_text(encoding='utf-8')
          provider = Path('xDrip Watch Complication/XDripWatchComplication+Provider.swift').read_text(encoding='utf-8')
          graph = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift').read_text(encoding='utf-8')
          circular = Path('xDrip Watch Complication/Views/AccessoryCircularView.swift').read_text(encoding='utf-8')

          required = [
              'directG7Manager = G7DirectBLEManager(',
              'directG7Manager?.start()',
              'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"',
              'func centralManager(_ central: CBCentralManager, willRestoreState dict:',
              'scheduleReconnect()',
              'processDirectG7Reading(reading)',
              'updateComplicationData()',
              'xdrip.g7Direct.lifecycleTrace41',
              'trace41("RX4E'
          ]
          for token in required:
              assert token in state, f'missing permanent Build42 function: {token}'

          assert 'directG7Manager = nil' not in state
          assert 'Auto-Direct aus · Auth-Test bereit' not in state
          assert '<string>bluetooth-central</string>' in plist
          assert 'xDripGraphV33' in provider or 'xDripGraphV33' in Path('xDrip Watch Complication/XDripWatchComplication.swift').read_text(encoding='utf-8')
          assert '150' in graph
          assert '60' in circular

          manager = state.split('// MARK: - Direct G7 BLE manager', 1)[1].split('// MARK: - WCSession delegate', 1)[0]
          assert 'writeValue(' not in manager, 'Direct-G7 manager must remain Notify-only'
          print('Build42 permanent functional contract verified.')
          PY
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Watch app and extension
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build42-ipa
          mkdir -p /tmp/xdrip-build42-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build42-ipa
          WATCH_APP="$(find /tmp/xdrip-build42-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"
          codesign --verify --deep --strict "$WATCH_APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.widgetkit-extension'
          echo 'Build42 packaged Watch app and extension verified.'

      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Publish permanent Build 42 source baseline
        run: |
          set -euo pipefail
          git config user.name 'Neuroform'
          git config user.email '70688199+Neuroform@users.noreply.github.com'
          git checkout -B watch-build42-functional-baseline
          git add -u
          if git diff --cached --quiet; then
            echo 'No tracked source changes to commit.'
          else
            git commit -m 'Build 42 functional baseline: Direct G7 background + accepted widgets'
          fi
          git push origin HEAD:refs/heads/watch-build42-functional-baseline --force
          echo 'Permanent baseline published. Future Watch builds must start from watch-build42-functional-baseline.'

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build42-functional-baseline-artifacts
          path: |
            artifacts
            buildlog
