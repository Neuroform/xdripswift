name: Personal xDrip G7 Watch Build 46
run-name: G7 Watch Build 46 Persistent Direct G7 Notify Stream (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/personal_watch_g7_build46_persistent_notify_stream.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 46
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout Build 45 proven direct-widget baseline
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: watch-build45-bluetooth-alert-bypass
          token: ${{ secrets.GH_PAT }}

      - name: Checkout current Build 46 patch only
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}
          path: _build46_patch

      - name: Verify Build 45 prerequisites
        run: |
          set -euo pipefail
          STATE='xDrip Watch App/DataModels/WatchStateModel.swift'
          APP='xDrip Watch App/xDripWatchApp.swift'
          grep -Fq 'publishReadingDirectlyToWidgets(_ reading: DirectG7Reading)' "$STATE"
          grep -Fq 'publishReadingDirectlyToWidgets(reading)' "$STATE"
          grep -Fq 'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"' "$STATE"
          grep -Fq 'setNotifyValue(true' "$STATE"
          grep -Fq 'knownPeripheralIDKey = "xdrip.g7Direct.knownPeripheralID.build45"' "$STATE"
          grep -Fq '.backgroundTask(.bluetoothAlert)' "$APP"
          grep -Fq '<string>bluetooth-central</string>' 'xDrip-Watch-App-Info.plist'
          echo 'Build 45 prerequisites verified.'

      - name: Freeze completed UI widgets and transports
        run: |
          set -euo pipefail
          for f in \
            'xDrip Watch App/Views/RootView.swift' \
            'xDrip Watch App/Views/BigNumberView/BigNumberView.swift' \
            'xDrip Watch App/xDripWatchApp.swift' \
            'xDrip Watch Complication/XDripWatchComplication+Provider.swift' \
            'xDrip Watch Complication/XDripWatchComplication.swift' \
            'xDrip Watch Complication/Views/AccessoryRectangularView.swift' \
            'xDrip Watch Complication/Views/AccessoryCircularView.swift' \
            'xDrip/Managers/Watch/WatchManager.swift' \
            'xDrip-Watch-App-Info.plist'; do
            shasum -a 256 "$f" >> /tmp/build46-frozen.sha
          done

      - name: Apply persistent Direct G7 notify stream
        run: |
          set -euo pipefail
          python3 _build46_patch/.github/scripts/apply_g7_watch_build46_persistent_notify_stream.py

      - name: Verify Build 46 contract
        run: |
          set -euo pipefail
          shasum -a 256 -c /tmp/build46-frozen.sha
          python3 - <<'PY'
          from pathlib import Path

          state = Path('xDrip Watch App/DataModels/WatchStateModel.swift').read_text(encoding='utf-8')
          manager = state.split('// MARK: - Direct G7 BLE manager', 1)[1].split('// MARK: - WCSession delegate', 1)[0]

          required = [
              'publishReadingDirectlyToWidgets(_ reading: DirectG7Reading)',
              'publishReadingDirectlyToWidgets(reading)',
              'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"',
              'setNotifyValue(true',
              'knownPeripheralIDKey = "xdrip.g7Direct.knownPeripheralID.build45"',
              'AUTH watchdog bypassed; keep notify subscription alive',
              'Widgets direkt aktualisiert · Notify bleibt aktiv',
              'xDripGraphV33', 'xDripBGV36', 'xDripDeltaV36'
          ]
          for token in required:
              assert token in state, f'missing Build 46 requirement: {token}'

          # Critical: the old 20-second app-owned auth timer must no longer be capable of
          # cancelling the live peripheral. Only genuine CoreBluetooth failure/disconnect paths
          # may drive reconnects.
          timeout = manager.split('private func armAuthenticationTimeout(for peripheral: CBPeripheral)', 1)[1].split('private func parseG7Glucose', 1)[0]
          assert 'asyncAfter' not in timeout
          assert 'cancelPeripheralConnection' not in timeout

          # Every valid 0x4E must still be persisted to widgets before the legacy auth/UI gate.
          receive = manager.split('guard characteristic.uuid == controlUUID, value[0] == 0x4E else { return }', 1)[1]
          assert receive.index('publishReadingDirectlyToWidgets(reading)') < receive.index('guard authenticated else')

          # Direct BLE lifecycle and WidgetKit bridge remain intact.
          assert 'didDisconnectPeripheral' in manager
          assert 'scheduleReconnect()' in manager
          assert 'willRestoreState dict:' in manager

          print('Build 46 contract verified: valid G7 Notify stream is not torn down by the legacy 20-second auth watchdog; existing widget bypass preserved.')
          PY

          changed="$(git diff --name-only | grep -v '^_build46_patch/' || true)"
          test "$changed" = 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Watch app and extension
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build46-ipa
          mkdir -p /tmp/xdrip-build46-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build46-ipa
          WATCH_APP="$(find /tmp/xdrip-build46-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"
          codesign --verify --deep --strict "$WATCH_APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.widgetkit-extension'
          echo 'Build 46 packaged Watch app and complication extension verified.'

      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Publish Build 46 additive baseline
        run: |
          set -euo pipefail
          git config user.name 'Neuroform'
          git config user.email '70688199+Neuroform@users.noreply.github.com'
          git checkout -B watch-build46-persistent-notify-stream
          git add 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git commit -m 'Build 46: keep Direct G7 notify stream alive for widget bypass'
          git push origin HEAD:refs/heads/watch-build46-persistent-notify-stream --force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build46-persistent-notify-stream-artifacts
          path: |
            artifacts
            buildlog
