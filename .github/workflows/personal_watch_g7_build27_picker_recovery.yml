name: Personal xDrip G7 Watch Build 27
run-name: G7 Watch Build 27 Picker Recovery (${{ github.ref_name }})

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/apply_g7_watch_build27_picker_recovery.py'
      - '.github/workflows/personal_watch_g7_build27_picker_recovery.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 27
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Check patch syntax
        run: |
          python3 -m py_compile .github/scripts/apply_g7_watch_build15_multicycle_validation.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build21_single_configurable_complication.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build25_final_ultra_complications.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build26_widgetkit_registration_recovery.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build26_final_proportional_graph.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build27_picker_recovery.py

      - name: Apply baseline and diagnostics
        run: |
          python3 .github/scripts/apply_personal_watch_phase1.py
          python3 .github/scripts/apply_g7_watch_ble_diagnostic.py
          python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py
          python3 .github/scripts/apply_g7_watch_auth_telemetry.py
          python3 .github/scripts/apply_g7_watch_build11_discovery.py
          python3 .github/scripts/apply_g7_watch_build12_multiwindow.py
          python3 .github/scripts/apply_g7_watch_build13_notify_listener.py
          python3 .github/scripts/apply_g7_watch_build14_passive_decoder.py
          python3 .github/scripts/apply_g7_watch_build15_multicycle_validation.py

      - name: Apply complication chain 16-21
        run: |
          python3 .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 .github/scripts/apply_g7_watch_build21_single_configurable_complication.py

      - name: Apply Build 22 sizing prepatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift')
          t=p.read_text(encoding='utf-8')
          repl={
            'let labelFontSize: CGFloat = size.width >= 150 ? 9.0 : 8.2':'let labelFontSize: CGFloat = size.width >= 150 ? 11.0 : 10.0',
            'let leftMargin: CGFloat = size.width >= 150 ? 24.0 : 22.0':'let leftMargin: CGFloat = size.width >= 150 ? 28.0 : 25.0',
            'let bottomMargin: CGFloat = 17.0':'let bottomMargin: CGFloat = 19.0'}
          for a,b in repl.items():
              if t.count(a)!=1: raise RuntimeError(a)
              t=t.replace(a,b,1)
          p.write_text(t,encoding='utf-8')
          PY

      - name: Apply Builds 22-26 UI and WidgetKit chain
        run: |
          python3 .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py
          python3 .github/scripts/apply_g7_watch_build25_final_ultra_complications.py
          python3 .github/scripts/apply_g7_watch_build26_widgetkit_registration_recovery.py
          python3 .github/scripts/apply_g7_watch_build26_final_proportional_graph.py

      - name: Apply Build 27 picker recovery
        run: python3 .github/scripts/apply_g7_watch_build27_picker_recovery.py

      - name: Verify Build 27 source before compiling
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app=Path('xDrip Watch App/xDripWatchApp.swift').read_text(encoding='utf-8')
          for token in ['ComplicationController','xDrip.graph.v27','xDrip.bg.v27','xDrip.trend.v27','Martin’s xDrip Graph','xDrip BG mg/dL','BG Trend + Δ mg/dL','xDripGraphV26','xDripBGV26','xDripTrendV26','getPlaceholderTemplate','reloadComplicationDescriptors']:
              assert token in app, token
          with Path('xDrip-Watch-App-Info.plist').open('rb') as f:
              info=plistlib.load(f)
          assert info['CLKComplicationPrincipalClass']=='$(PRODUCT_MODULE_NAME).ComplicationController'
          assert set(info['CLKComplicationSupportedFamilies'])=={'CLKComplicationFamilyGraphicCircular','CLKComplicationFamilyGraphicRectangular'}
          widget=Path('xDrip Watch Complication/XDripWatchComplication.swift').read_text(encoding='utf-8')
          for token in ['xDripGraphV26','xDripBGV26','xDripTrendV26','Martin’s xDrip Graph','xDrip BG mg/dL','BG Trend + Δ mg/dL']:
              assert token in widget, token
          graph=Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift').read_text(encoding='utf-8')
          assert '(maximumMgDl - clamped) / (maximumMgDl - minimumMgDl)' in graph
          print('Build27 source verified: proportional graph retained; 3 selectable descriptors map 1:1 to WidgetKit kinds.')
          PY
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged complication provider
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build27 && mkdir -p /tmp/xdrip-build27
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build27
          WATCH_APP="$(find /tmp/xdrip-build27/Payload -path '*/Watch/*.app' -type d -print -quit)"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$WATCH_APP" && test -n "$EXT"
          PRINCIPAL="$(/usr/libexec/PlistBuddy -c 'Print :CLKComplicationPrincipalClass' "$WATCH_APP/Info.plist")"
          test -n "$PRINCIPAL"
          /usr/libexec/PlistBuddy -c 'Print :CLKComplicationSupportedFamilies' "$WATCH_APP/Info.plist"
          EXT_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")"
          test "$EXT_POINT" = 'com.apple.widgetkit-extension'
          codesign --verify --deep --strict "$WATCH_APP"
          echo 'Packaged Build 27 verified.'

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build27-artifacts
          path: |
            artifacts
            buildlog
