name: 0. Clean Start xDrip 7.1.1
run-name: Clean Start xDrip 7.1.1 from pristine upstream

on:
  push:
    branches:
      - clean-zero-upstream-7.1.1
    paths:
      - '.github/workflows/clean_start_xdrip_7_1_1.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build pristine upstream xDrip 7.1.1
    needs: validate
    runs-on: macos-26
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout pristine upstream source
        uses: actions/checkout@v5
        with:
          ref: c268542e64626c564e626658fa9a6b90a059ada4
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Verify absolutely clean source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c268542e64626c564e626658fa9a6b90a059ada4"
          test "$(git status --porcelain)" = ""
          grep -q '^XDRIP_MARKETING_VERSION = 7.1.1$' xDrip/Version.xcconfig
          grep -q '^CURRENT_PROJECT_VERSION = 4233$' xDrip/Version.xcconfig
          echo "Verified: pristine JohanDegraeve/xdripswift 7.1.1 source, no previous Neuroform build code."

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify IPA
        run: |
          set -euo pipefail
          IPA="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA"
          rm -rf /tmp/xdrip-clean-zero && mkdir -p /tmp/xdrip-clean-zero
          unzip -q "$IPA" -d /tmp/xdrip-clean-zero
          APP="$(find /tmp/xdrip-clean-zero/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          test -n "$APP"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
          test "$VERSION" = "7.1.1"
          codesign --verify --deep --strict "$APP"
          echo "Verified IPA: version=$VERSION build=$BUILD"

      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: clean-start-xdrip-7.1.1-artifacts
          path: |
            artifacts
            buildlog
