name: Personal xDrip G7 Watch Build 44
run-name: G7 Watch Build 44 Persistent BLE Subscription (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/personal_watch_g7_build44_persistent_subscription.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 44
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout Build 43 direct-widget baseline
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: watch-build43-direct-widget-bridge
          token: ${{ secrets.GH_PAT }}

      - name: Checkout current Build 44 patch only
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.GH_PAT }}
          path: _build44_patch

      - name: Verify Build 43 prerequisites
        run: |
          set -euo pipefail
          STATE='xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -Fq 'publishReadingDirectlyToWidgets(_ reading: DirectG7Reading)' "$STATE"
          grep -Fq 'publishReadingDirectlyToWidgets(reading)' "$STATE"
          grep -Fq 'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"' "$STATE"
          grep -Fq 'setNotifyValue(true' "$STATE"
          grep -Fq '<string>bluetooth-central</string>' 'xDrip-Watch-App-Info.plist'
          echo 'Build 43 direct BLE + widget bypass prerequisites verified.'

      - name: Freeze completed UI and widget implementation
        run: |
          set -euo pipefail
          for f in \
            'xDrip Watch App/Views/RootView.swift' \
            'xDrip Watch App/Views/BigNumberView/BigNumberView.swift' \
            'xDrip Watch Complication/XDripWatchComplication+Provider.swift' \
            'xDrip Watch Complication/XDripWatchComplication.swift' \
            'xDrip Watch Complication/Views/AccessoryRectangularView.swift' \
            'xDrip Watch Complication/Views/AccessoryCircularView.swift' \
            'xDrip/Managers/Watch/WatchManager.swift' \
            'xDrip-Watch-App-Info.plist'; do
            shasum -a 256 "$f" >> /tmp/build44-frozen.sha
          done

      - name: Apply persistent BLE subscription hardening
        run: |
          set -euo pipefail
          python3 _build44_patch/.github/scripts/apply_g7_watch_build44_persistent_ble_subscription.py

      - name: Verify Build 44 contract
        run: |
          set -euo pipefail
          shasum -a 256 -c /tmp/build44-frozen.sha
          python3 - <<'PY'
          from pathlib import Path
          state = Path('xDrip Watch App/DataModels/WatchStateModel.swift').read_text(encoding='utf-8')
          required = [
              'publishReadingDirectlyToWidgets(_ reading: DirectG7Reading)',
              'publishReadingDirectlyToWidgets(reading)',
              'knownPeripheralIDKey = "xdrip.g7Direct.knownPeripheralID.build44"',
              'retrievePeripherals(withIdentifiers:',
              'setNotifyValue(true',
              'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"',
              'willRestoreState dict:',
              'beginDiscovery()',
              'UserDefaults.standard.set(peripheral.identifier.uuidString, forKey: knownPeripheralIDKey)',
              'xDripGraphV33',
              'xDripBGV36',
              'xDripDeltaV36'
          ]
          for token in required:
              assert token in state, f'missing Build 44 requirement: {token}'

          # Build 44 must preserve the direct sensor->widget write before the auth/UI-state gate.
          receive = state.split('guard characteristic.uuid == controlUUID, value[0] == 0x4E else { return }', 1)[1]
          assert receive.index('publishReadingDirectlyToWidgets(reading)') < receive.index('guard authenticated else')

          # No delayed reconnect timer may be relied on after disconnect.
          manager = state.split('// MARK: - Direct G7 BLE manager', 1)[1].split('// MARK: - WCSession delegate', 1)[0]
          reconnect = manager.split('private func scheduleReconnect()', 1)[1].split('private func armAuthenticationTimeout', 1)[0]
          assert 'asyncAfter' not in reconnect
          assert 'beginDiscovery()' in reconnect

          print('Build 44 contract verified: same xDrip Direct-G7 receiver, persistent CoreBluetooth subscription/restoration, direct widget bypass preserved.')
          PY

          changed="$(git diff --name-only | grep -v '^_build44_patch/' || true)"
          test "$changed" = 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Watch app and extension
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build44-ipa
          mkdir -p /tmp/xdrip-build44-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build44-ipa
          WATCH_APP="$(find /tmp/xdrip-build44-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"
          codesign --verify --deep --strict "$WATCH_APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.widgetkit-extension'
          echo 'Build 44 packaged Watch app and complication extension verified.'

      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Publish Build 44 additive baseline
        run: |
          set -euo pipefail
          git config user.name 'Neuroform'
          git config user.email '70688199+Neuroform@users.noreply.github.com'
          git checkout -B watch-build44-persistent-subscription
          git add 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git commit -m 'Build 44: persistent Direct G7 BLE subscription and widget bypass'
          git push origin HEAD:refs/heads/watch-build44-persistent-subscription --force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build44-persistent-subscription-artifacts
          path: |
            artifacts
            buildlog
