name: Personal xDrip Watch Phase 1
run-name: Personal Watch Phase 1 (${{ github.ref_name }})

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build personal xDrip4iOS
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Apply personal Apple Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Verify Phase 1 patch
        run: |
          grep -q 'updateApplicationContext' 'xDrip/Managers/Watch/WatchManager.swift'
          grep -q 'latestBgPayloadGeneratedAt' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q '7 \* 60' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          grep -q 'WERT ALT' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          echo 'Phase 1 Watch patch verified.'

      - name: Show local patch diff
        run: git diff --check && git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-phase1-build-artifacts
          path: |
            artifacts
            buildlog
