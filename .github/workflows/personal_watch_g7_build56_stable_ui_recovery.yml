name: Personal xDrip G7 Watch Build 56 Stable UI Recovery
run-name: G7 Watch Build 56 Stable UI Recovery
on:
  push:
    branches: [watch-build56-stable-ui-recovery]
    paths: ['.github/workflows/personal_watch_g7_build56_stable_ui_recovery.yml']
  workflow_dispatch:
jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit
  build:
    name: Build G7 Watch Build 56
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Checkout final UI branch
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0
          ref: watch-build56-stable-ui-recovery
          token: ${{ secrets.GH_PAT }}
      - name: Verify final UI whitelist and frozen runtime
        run: |
          set -euo pipefail
          git fetch origin watch-build49-system-autoreconnect
          changed="$(git diff --name-only origin/watch-build49-system-autoreconnect...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/personal_watch_g7_build56_stable_ui_recovery.yml' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift' | sort)"
          test "$changed" = "$expected"
          test "$(git rev-parse HEAD:'xDrip Watch Complication/Views/AccessoryCircularView.swift')" = "f91bf983ce987041d03651762f2d31ff83770fcf"
          for f in 'xDrip Watch Complication/XDripWatchComplication.swift' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift' 'xDrip Watch App/DataModels/WatchStateModel.swift' 'xDrip Watch App/Views/RootView.swift' 'xDrip Watch App/Views/BigNumberView/BigNumberView.swift' 'xDrip/Managers/Watch/WatchManager.swift' 'xDrip-Watch-App-Info.plist'; do
            test "$(git rev-parse origin/watch-build49-system-autoreconnect:"$f")" = "$(git rev-parse HEAD:"$f")"
          done
          graph='xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'visibleDuration: TimeInterval = 150 \* 60' "$graph"
          grep -q 'maximumVisibleReadings = 30' "$graph"
          grep -q 'targetLowMgDl = 70.0' "$graph"
          grep -q 'targetHighMgDl = 150.0' "$graph"
          grep -q 'fullHourTicks' "$graph"
          grep -q 'hourFormatter' "$graph"
          grep -q 'let plotLeft: CGFloat = 1.5' "$graph"
          grep -q 'let scaleX = plotRight - 1.0' "$graph"
          ! grep -q 'nowLine' "$graph"
          ! grep -q 'visibleDuration / 2' "$graph"
          state='xDrip Watch App/DataModels/WatchStateModel.swift'
          manager="$(awk '/private final class G7DirectBLEManager/{flag=1} /\/\/ MARK: - WCSession delegate/{flag=0} flag' "$state")"
          ! grep -q 'writeValue(Data(\[0x06' <<<"$manager"
          ! grep -q 'writeValue(Data(\[0x07' <<<"$manager"
          ! grep -q 'requestBond' <<<"$manager"
          ! grep -q 'B50_BOND' <<<"$manager"
          git diff --check origin/watch-build49-system-autoreconnect...HEAD
      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true
      - name: Install Project Dependencies
        run: bundle install
      - name: Sync clock
        run: sudo sntp -sS time.windows.com
      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Verify packaged Watch app and WidgetKit extension
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-final-ui && mkdir -p /tmp/xdrip-final-ui
          unzip -q "$IPA_PATH" -d /tmp/xdrip-final-ui
          APP="$(find /tmp/xdrip-final-ui/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          WATCH_APP="$(find "$APP/Watch" -maxdepth 1 -name '*.app' -type d -print -quit)"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$APP" && test -n "$WATCH_APP" && test -n "$EXT"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$WATCH_APP/Info.plist" | grep -qx 'bluetooth-central'
          codesign --verify --deep --strict "$APP"
      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build56-stable-ui-recovery-artifacts
          path: |
            artifacts
            buildlog
