name: Check ASC Build 60 Direct
run-name: Direct App Store Connect status for Build 60

on:
  push:
    branches: [clean-zero-upstream-7.1.1]
    paths: ['.github/workflows/check_asc_build60_direct.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    steps:
      - name: Query App Store Connect directly
        env:
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, time, base64, urllib.request, urllib.parse
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives.asymmetric.utils import decode_dss_signature

          def b64url(b):
              return base64.urlsafe_b64encode(b).rstrip(b'=').decode()

          now = int(time.time())
          header = {"alg":"ES256","kid":os.environ["FASTLANE_KEY_ID"],"typ":"JWT"}
          payload = {"iss":os.environ["FASTLANE_ISSUER_ID"],"iat":now,"exp":now+900,"aud":"appstoreconnect-v1"}
          h = b64url(json.dumps(header,separators=(',',':')).encode())
          p = b64url(json.dumps(payload,separators=(',',':')).encode())
          signing_input = f"{h}.{p}".encode()
          key = serialization.load_pem_private_key(os.environ["FASTLANE_KEY"].encode(), password=None)
          der = key.sign(signing_input, ec.ECDSA(hashes.SHA256()))
          r,s = decode_dss_signature(der)
          sig = r.to_bytes(32,'big') + s.to_bytes(32,'big')
          token = f"{h}.{p}.{b64url(sig)}"

          params = {
              "filter[app]":"6809078288",
              "filter[version]":"60",
              "include":"preReleaseVersion",
              "fields[builds]":"version,processingState,expired,uploadedDate,minOsVersion,preReleaseVersion",
              "fields[preReleaseVersions]":"version,platform",
              "limit":"20"
          }
          url = "https://api.appstoreconnect.apple.com/v1/builds?" + urllib.parse.urlencode(params)
          req = urllib.request.Request(url, headers={"Authorization":"Bearer "+token})
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.load(resp)
          print(json.dumps(data, indent=2))
          PY
