name: Personal xDrip G7 Watch Build 22
run-name: G7 Watch Build 22 Template Registration (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/apply_g7_watch_build22_template_registration.py'
      - '.github/workflows/personal_watch_g7_build22_template_registration.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 22
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Check Build 15-22 patch syntax
        run: |
          python3 -m py_compile .github/scripts/apply_g7_watch_build15_multicycle_validation.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build21_single_configurable_complication.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build22_template_registration.py

      - name: Apply personal Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply G7 direct baseline and diagnostics
        run: |
          python3 .github/scripts/apply_g7_watch_ble_diagnostic.py
          python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py
          python3 .github/scripts/apply_g7_watch_auth_telemetry.py
          python3 .github/scripts/apply_g7_watch_build11_discovery.py
          python3 .github/scripts/apply_g7_watch_build12_multiwindow.py
          python3 .github/scripts/apply_g7_watch_build13_notify_listener.py
          python3 .github/scripts/apply_g7_watch_build14_passive_decoder.py
          python3 .github/scripts/apply_g7_watch_build15_multicycle_validation.py

      - name: Apply Build 16-21 complication chain
        run: |
          python3 .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 .github/scripts/apply_g7_watch_build21_single_configurable_complication.py

      - name: Enlarge graph time and BG axis labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'let labelFontSize: CGFloat = size.width >= 150 ? 9.0 : 8.2':
                  'let labelFontSize: CGFloat = size.width >= 150 ? 11.0 : 10.0',
              'let leftMargin: CGFloat = size.width >= 150 ? 24.0 : 22.0':
                  'let leftMargin: CGFloat = size.width >= 150 ? 28.0 : 25.0',
              'let bottomMargin: CGFloat = 17.0':
                  'let bottomMargin: CGFloat = 19.0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Axis patch expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Build 22 current-template registration
        run: python3 .github/scripts/apply_g7_watch_build22_template_registration.py

      - name: Verify Build 22 source architecture
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          plist = Path('xDrip Watch Complication/Info.plist')
          with plist.open('rb') as f:
              info = plistlib.load(f)
          assert info['CFBundleDisplayName'] == 'xDrip'
          assert info['CFBundleExecutable'] == '$(EXECUTABLE_NAME)'
          assert info['CFBundleIdentifier'] == '$(PRODUCT_BUNDLE_IDENTIFIER)'
          assert info['CFBundlePackageType'] == '$(PRODUCT_BUNDLE_PACKAGE_TYPE)'
          assert info['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
          assert 'NSExtensionAttributes' not in info['NSExtension']

          project = Path('xdrip.xcodeproj/project.pbxproj').read_text(encoding='utf-8')
          assert project.count('APPLICATION_EXTENSION_API_ONLY = YES;') >= 2
          assert project.count('SUPPORTED_PLATFORMS = "watchos watchsimulator";') >= 2
          assert project.count('GENERATE_INFOPLIST_FILE = NO;') >= 2

          widget = Path('xDrip Watch Complication/XDripWatchComplication.swift').read_text(encoding='utf-8')
          provider = Path('xDrip Watch Complication/XDripWatchComplication+Provider.swift').read_text(encoding='utf-8')
          assert '@main' in widget
          assert 'StaticConfiguration(' in widget
          assert 'AppIntentConfiguration(' not in widget
          assert 'WidgetBundle' not in widget
          assert '.supportedFamilies([.accessoryRectangular, .accessoryCircular])' in widget
          assert 'struct Provider: TimelineProvider' in provider
          assert 'AppIntentTimelineProvider' not in provider

          print('Build22 source is a single static watchOS WidgetKit extension using explicit template-style plist/settings.')
          PY
          grep -Fq 'private let visibleDuration: TimeInterval = 2 * 60 * 60' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -Fq 'let labelFontSize: CGFloat = size.width >= 150 ? 11.0 : 10.0' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -Fq 'WidgetCenter.shared.reloadTimelines(ofKind: "xDripWatchComplication")' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git diff --check

      - name: Show effective complication build settings
        run: |
          xcodebuild -project xdrip.xcodeproj \
            -target 'xDrip Watch Complication Extension' \
            -configuration Release \
            -showBuildSettings | \
            egrep 'APPLICATION_EXTENSION_API_ONLY|GENERATE_INFOPLIST_FILE|INFOPLIST_FILE|PRODUCT_BUNDLE_IDENTIFIER|SDKROOT|SKIP_INSTALL|SUPPORTED_PLATFORMS|TARGETED_DEVICE_FAMILY|WATCHOS_DEPLOYMENT_TARGET'

      - name: Show local patch diff
        run: git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Build 22 complication
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build22-ipa
          mkdir -p /tmp/xdrip-build22-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build22-ipa

          WATCH_APP="$(find /tmp/xdrip-build22-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$EXT/Info.plist")"
          EXTENSION_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$EXT/Info.plist")"
          PACKAGE_TYPE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundlePackageType' "$EXT/Info.plist")"

          test "$DISPLAY_NAME" = 'xDrip'
          test "$EXTENSION_POINT" = 'com.apple.widgetkit-extension'
          test "$PACKAGE_TYPE" = 'XPC!'
          test -x "$EXT/$EXECUTABLE"
          strings "$EXT/$EXECUTABLE" | grep -Fq 'xDripWatchComplication'

          if /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes' "$EXT/Info.plist" >/dev/null 2>&1; then
            echo 'ERROR: unexpected NSExtensionAttributes in WidgetKit extension'
            exit 1
          fi

          echo "Watch app: $WATCH_APP"
          echo "Complication bundle: $BUNDLE_ID"
          echo "Complication display name: $DISPLAY_NAME"
          plutil -p "$EXT/Info.plist"
          codesign -d --entitlements :- "$EXT" 2>&1 || true
          codesign --verify --deep --strict "$WATCH_APP"
          echo 'Packaged Build 22 complication passed template-structure verification.'

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build22-artifacts
          path: |
            artifacts
            buildlog
