name: Check TestFlight Build 60
run-name: Check TestFlight Build 60 status

on:
  push:
    branches: [clean-zero-upstream-7.1.1]
    paths: ['.github/workflows/check_testflight_build60.yml']
  workflow_dispatch:

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          ref: clean-zero-upstream-7.1.1

      - name: Install dependencies
        run: bundle install

      - name: Create App Store Connect API key file
        env:
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
        run: |
          ruby -rjson -e 'File.write("/tmp/asc_key.json", JSON.pretty_generate({"key_id"=>ENV["FASTLANE_KEY_ID"],"issuer_id"=>ENV["FASTLANE_ISSUER_ID"],"key"=>ENV["FASTLANE_KEY"]}))'

      - name: Query TestFlight builds
        env:
          TEAMID: ${{ secrets.TEAMID }}
        run: |
          set -euo pipefail
          bundle exec fastlane pilot builds             --api_key_path /tmp/asc_key.json             --app_identifier "com.${TEAMID}.xdripswift"
