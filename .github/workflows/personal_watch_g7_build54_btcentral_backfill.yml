name: Personal xDrip G7 Watch Build 54
run-name: G7 Watch Build 54 bt.central + Backfill (${{ github.ref_name }})

on:
  push:
    branches: [master]
    paths: ['.github/workflows/personal_watch_g7_build54_btcentral_backfill.yml']
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 54
    needs: validate
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout workflow source
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Preserve Build 54 patch script
        run: |
          cp '.github/scripts/apply_g7_watch_build54_btcentral_backfill.py' /tmp/apply_g7_watch_build54_btcentral_backfill.py
          python3 -m py_compile /tmp/apply_g7_watch_build54_btcentral_backfill.py

      - name: Checkout Build 53 baseline
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: watch-build53-immediate-recovery
          token: ${{ secrets.GH_PAT }}

      - name: Freeze completed widget UI and iPhone transport
        run: |
          set -euo pipefail
          : > /tmp/build54-frozen.sha
          for f in \
            'xDrip Watch App/Views/BigNumberView/BigNumberView.swift' \
            'xDrip Watch App/Views/RootView.swift' \
            'xDrip Watch App/xDripWatchApp.swift' \
            'xDrip Watch Complication/XDripWatchComplication+Provider.swift' \
            'xDrip Watch Complication/XDripWatchComplication.swift' \
            'xDrip Watch Complication/Views/AccessoryRectangularView.swift' \
            'xDrip Watch Complication/Views/AccessoryCircularView.swift' \
            'xDrip/Managers/Watch/WatchManager.swift' \
            'xDrip-Watch-App-Info.plist' \
            'xDrip/xDrip.xcconfig' \
            'xDrip/Supporting Files/Info.plist'; do
            shasum -a 256 "$f" >> /tmp/build54-frozen.sha
          done

      - name: Apply Build 54 bt.central architecture
        run: python3 /tmp/apply_g7_watch_build54_btcentral_backfill.py

      - name: Verify Build 54 architecture and frozen UI
        run: |
          set -euo pipefail
          shasum -a 256 -c /tmp/build54-frozen.sha
          python3 - <<'PY'
          from pathlib import Path
          s = Path('xDrip Watch App/DataModels/WatchStateModel.swift').read_text(encoding='utf-8')
          m = s.split('private final class G7DirectBLEManager', 1)[1].split('// MARK: - WCSession delegate', 1)[0]

          for token in [
              'xDrip.G7.Direct.bt.central',
              'queue: centralQueue54',
              'CBCentralManagerOptionRestoreIdentifierKey: "xDrip.G7.Direct.Central"',
              'KNOWN_PEER_ARMED54',
              'KNOWN_PEER_RECOVERY54',
              'retrievePeripherals(withIdentifiers:',
              'FALLBACK_SCAN54',
              'BACKFILL_REQUEST54',
              'leGattNearBackgroundNotificationLimit',
              'leGattExceededBackgroundNotificationLimit',
              'CORE_BLUETOOTH_0x4E',
              'CORE_BLUETOOTH_BACKFILL_3536',
              'publishReadingDirectlyToWidgets(reading)',
              'WidgetCenter.shared.reloadAllTimelines()',
              'xDripGraphV33', 'xDripBGV36', 'xDripDeltaV36'
          ]:
              assert token in m, token

          for forbidden in [
              'CBConnectPeripheralOptionEnableAutoReconnect',
              'central.registerForConnectionEvents(',
              'writeValue(Data([0x06',
              'writeValue(Data([0x07',
              'B50_BOND',
              'requestBond'
          ]:
              assert forbidden not in m, forbidden

          assert 'central.connect(known, options: nil)' in m
          assert 'withServices: [advertisementUUID]' in m  # fallback discovery remains available
          print('Build54 verified: serial bt.central, one known peer, targeted backfill, frozen widgets.')
          PY
          changed="$(git diff --name-only | sort)"
          expected="xDrip Watch App/DataModels/WatchStateModel.swift"
          test "$changed" = "$expected"
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build and Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Watch app extension and preserved name
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build54-ipa && mkdir -p /tmp/xdrip-build54-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build54-ipa
          APP="$(find /tmp/xdrip-build54-ipa/Payload -maxdepth 1 -name '*.app' -type d -print -quit)"
          WATCH_APP="$(find "$APP/Watch" -maxdepth 1 -name '*.app' -type d -print -quit)"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$APP" && test -n "$WATCH_APP" && test -n "$EXT"
          python3 - "$APP/Info.plist" "$WATCH_APP/Info.plist" <<'PY'
          import plistlib, sys
          expected = "Martin\u2018s xDrip"
          with open(sys.argv[1], 'rb') as f: phone = plistlib.load(f)
          with open(sys.argv[2], 'rb') as f: watch = plistlib.load(f)
          assert phone.get('CFBundleDisplayName') == expected, phone.get('CFBundleDisplayName')
          assert watch.get('CFBundleDisplayName') == expected, watch.get('CFBundleDisplayName')
          print('Build54 packaged app names preserved:', expected)
          PY
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")" = 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes:0' "$WATCH_APP/Info.plist" | grep -qx 'bluetooth-central'
          codesign --verify --deep --strict "$APP"

      - name: Upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Publish Build 54 additive baseline
        run: |
          set -euo pipefail
          git config user.name 'Neuroform'
          git config user.email '70688199+Neuroform@users.noreply.github.com'
          git checkout -B watch-build54-bt-central-backfill
          git add 'xDrip Watch App/DataModels/WatchStateModel.swift'
          git commit -m 'Build 54: serialize Direct G7 and add targeted gap backfill'
          git push origin HEAD:refs/heads/watch-build54-bt-central-backfill --force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build54-bt-central-backfill-artifacts
          path: |
            artifacts
            buildlog
