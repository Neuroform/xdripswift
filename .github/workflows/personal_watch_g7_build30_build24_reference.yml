name: Personal xDrip G7 Watch Build 30
run-name: G7 Watch Build 30 Build24 Reference (${{ github.ref_name }})

on:
  push:
    branches: [master]
    paths:
      - '.github/scripts/apply_g7_watch_build30_build24_reference_graph.py'
      - '.github/workflows/personal_watch_g7_build30_build24_reference.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 30
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Syntax check exact Build24 chain plus Build30
        run: |
          python3 -m py_compile .github/scripts/apply_g7_watch_build15_multicycle_validation.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build21_single_configurable_complication.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build30_build24_reference_graph.py

      - name: Apply personal Watch Phase 1
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply G7 baseline through Build 15
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_g7_watch_ble_diagnostic.py
          python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py
          python3 .github/scripts/apply_g7_watch_auth_telemetry.py
          python3 .github/scripts/apply_g7_watch_build11_discovery.py
          python3 .github/scripts/apply_g7_watch_build12_multiwindow.py
          python3 .github/scripts/apply_g7_watch_build13_notify_listener.py
          python3 .github/scripts/apply_g7_watch_build14_passive_decoder.py
          python3 .github/scripts/apply_g7_watch_build15_multicycle_validation.py

      - name: Apply exact Build 16-21 chain used by Build24
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 .github/scripts/apply_g7_watch_build21_single_configurable_complication.py

      - name: Apply exact Build22 graph baseline sizing used by Build24
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'let labelFontSize: CGFloat = size.width >= 150 ? 9.0 : 8.2':
                  'let labelFontSize: CGFloat = size.width >= 150 ? 11.0 : 10.0',
              'let leftMargin: CGFloat = size.width >= 150 ? 24.0 : 22.0':
                  'let leftMargin: CGFloat = size.width >= 150 ? 28.0 : 25.0',
              'let bottomMargin: CGFloat = 17.0':
                  'let bottomMargin: CGFloat = 19.0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Build30 Build24-reference axis patch expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply exact Build22-24 picker chain
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py

      - name: Verify Build24 registration BEFORE Build30 UI patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('xDrip Watch App/xDripWatchApp.swift').read_text(encoding='utf-8')
          for token in [
              'final class ComplicationController: NSObject, CLKComplicationDataSource, CLKComplicationWidgetMigrator',
              'identifier: Self.graphDescriptorIdentifier',
              'displayName: "xDrip Graph"',
              'supportedFamilies: [.graphicRectangular]',
              'identifier: Self.bgDescriptorIdentifier',
              'displayName: "xDrip BG"',
              'supportedFamilies: [.graphicCircular]',
              'kind: "xDripWatchComplication"',
          ]:
              assert token in app, token
          with Path('xDrip-Watch-App-Info.plist').open('rb') as f:
              p = plistlib.load(f)
          assert p['CLKComplicationPrincipalClass'] == '$(PRODUCT_MODULE_NAME).ComplicationController'
          assert p['CLKComplicationSupportedFamilies'] == [
              'CLKComplicationFamilyGraphicCircular',
              'CLKComplicationFamilyGraphicRectangular'
          ]
          print('Exact Build24 picker registration verified before UI-only Build30 patch.')
          PY

      - name: Apply Build30 UI-only graph patch
        run: python3 .github/scripts/apply_g7_watch_build30_build24_reference_graph.py

      - name: Verify Build30 did not regress picker registration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path('xDrip Watch App/xDripWatchApp.swift').read_text(encoding='utf-8')
          assert app.count('final class ComplicationController') == 1
          assert app.count('xDrip.graph') == 1
          assert app.count('xDrip.bg') == 1
          assert 'reloadComplicationDescriptors' not in app
          assert 'WidgetBundle' not in Path('xDrip Watch Complication/XDripWatchComplication.swift').read_text(encoding='utf-8')
          with Path('xDrip-Watch-App-Info.plist').open('rb') as f:
              p = plistlib.load(f)
          assert p['CLKComplicationPrincipalClass'] == '$(PRODUCT_MODULE_NAME).ComplicationController'
          assert p['CLKComplicationSupportedFamilies'] == [
              'CLKComplicationFamilyGraphicCircular',
              'CLKComplicationFamilyGraphicRectangular'
          ]
          graph = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift').read_text(encoding='utf-8')
          assert '(maximumMgDl - clamped) / (maximumMgDl - minimumMgDl)' in graph
          assert 'case 220:' in graph and 'color = .yellow' in graph
          assert 'case 160, 70:' in graph and 'color = .white' in graph
          assert 'case 40:' in graph and 'color = .red' in graph
          assert 'with: .color(Color.white)' in graph
          assert 'UnitPoint(x: 1, y: 1)' in graph
          print('Build30 source verified: Build24 registration intact; final graph patch isolated.')
          PY
          git diff --check

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Build30 registration matches Build24
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build30-ipa && mkdir -p /tmp/xdrip-build30-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build30-ipa
          WATCH_APP="$(find /tmp/xdrip-build30-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          WATCH_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$WATCH_APP/Info.plist")"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"
          PRINCIPAL="$(/usr/libexec/PlistBuddy -c 'Print :CLKComplicationPrincipalClass' "$WATCH_APP/Info.plist")"
          test -n "$PRINCIPAL"
          /usr/libexec/PlistBuddy -c 'Print :CLKComplicationSupportedFamilies' "$WATCH_APP/Info.plist"
          strings "$WATCH_APP/$WATCH_EXEC" > /tmp/build30-watch-strings.txt
          grep -Fq 'ComplicationController' /tmp/build30-watch-strings.txt
          grep -Fq 'xDrip.graph' /tmp/build30-watch-strings.txt
          grep -Fq 'xDrip.bg' /tmp/build30-watch-strings.txt
          grep -Fq 'xDripWatchComplication' /tmp/build30-watch-strings.txt
          EXTENSION_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")"
          test "$EXTENSION_POINT" = 'com.apple.widgetkit-extension'
          codesign --verify --deep --strict "$WATCH_APP"
          echo 'Build30 packaged registration verified against Build24 architecture.'

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build30-build24-reference-artifacts
          path: |
            artifacts
            buildlog
