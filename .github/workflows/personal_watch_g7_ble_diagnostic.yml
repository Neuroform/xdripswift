name: Personal xDrip G7 Watch Direct
run-name: G7 Watch Direct (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/apply_g7_watch_ble_diagnostic.py'
      - '.github/scripts/apply_g7_watch_background_hardening.py'
      - '.github/workflows/personal_watch_g7_ble_diagnostic.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch direct integration
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Apply personal Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply G7 Watch direct integration patch
        run: python3 .github/scripts/apply_g7_watch_ble_diagnostic.py

      - name: Apply G7 Watch low-power background hardening
        run: python3 .github/scripts/apply_g7_watch_background_hardening.py

      - name: Fix G7 Direct Swift access level
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('xDrip Watch App/DataModels/WatchStateModel.swift')
          text = path.read_text()
          old = '    func setHandlers(\n'
          new = '    fileprivate func setHandlers(\n'
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f'Expected one G7 setHandlers declaration, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify G7 Watch direct integration
        run: |
          grep -q 'G7DirectBLEManager' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'G7DirectBLEManager.shared' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'fileprivate func setHandlers' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'retrievePeripherals(withIdentifiers' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'reconnectImmediately' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'lastAdvertisement' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'lastWidgetWrite' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          ! grep -q 'scheduleReconnect()' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          ! grep -q 'armAuthenticationTimeout' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'G7DirectBLEManager.shared.start()' 'xDrip Watch App/xDripWatchApp.swift'
          grep -q 'processDirectG7Reading' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q '0x4E' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'G7DirectStatusView' 'xDrip Watch App/Views/RootView.swift'
          grep -q 'Background-Diagnose' 'xDrip Watch App/Views/RootView.swift'
          grep -q 'NSBluetoothAlwaysUsageDescription' 'xDrip-Watch-App-Info.plist'
          grep -q 'UIBackgroundModes' 'xDrip-Watch-App-Info.plist'
          grep -q 'bluetooth-central' 'xDrip-Watch-App-Info.plist'
          grep -q 'complicationDataSource' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          grep -q 'dataSource == "G7 BLE"' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'WERT ALT' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          git diff --check
          echo 'G7 Watch direct low-power/background integration verified.'

      - name: Show local patch diff
        run: git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-direct-artifacts
          path: |
            artifacts
            buildlog
