name: Personal xDrip G7 Watch Build 12
run-name: G7 Watch Build 12 Multi-Window GATT (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/apply_g7_watch_ble_diagnostic.py'
      - '.github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py'
      - '.github/scripts/apply_g7_watch_auth_telemetry.py'
      - '.github/scripts/apply_g7_watch_build11_discovery.py'
      - '.github/scripts/apply_g7_watch_build12_multiwindow.py'
      - '.github/workflows/personal_watch_g7_ble_diagnostic.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 12
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Apply personal Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply Build 7 G7 direct baseline
        run: python3 .github/scripts/apply_g7_watch_ble_diagnostic.py

      - name: Apply manual G7 auth probe and stale BG safety
        run: python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py

      - name: Apply G7 auth disconnect telemetry
        run: python3 .github/scripts/apply_g7_watch_auth_telemetry.py

      - name: Apply Build 11 six-minute G7 discovery
        run: python3 .github/scripts/apply_g7_watch_build11_discovery.py

      - name: Apply Build 12 multi-window connection/GATT probe
        run: python3 .github/scripts/apply_g7_watch_build12_multiwindow.py

      - name: Verify passive Build 12 multi-window probe
        run: |
          grep -q 'G7AuthProbeManager' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'g7AuthProbeTelemetry' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'directG7Manager = nil' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'testWindowSeconds: TimeInterval = 600' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'minStableConnectionSeconds: TimeInterval = 0.25' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'CBCentralManagerScanOptionAllowDuplicatesKey: true' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'Connection ≥250 ms · discoverServices 3532' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'discoverCharacteristics(nil, for: service)' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'PASSIV-GATT erfolgreich · KEIN Notify · KEIN TX' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'DISCONNECT #' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'RETRY in 3 s' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'Build 12 Multi-Window GATT · 10-Min-Fenster' 'xDrip Watch App/Views/RootView.swift'
          grep -q 'KEIN AKTUELLER WERT' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'Text("---")' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'hasRecentReading && entry.widgetState.dataSource == "G7 BLE"' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'NSBluetoothAlwaysUsageDescription' 'xDrip-Watch-App-Info.plist'
          ! grep -q 'directG7Manager?.start()' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          ! grep -q 'G7DirectBLEManager.shared' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          ! grep -q 'CBCentralManagerOptionRestoreIdentifierKey' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          ! grep -q '<string>bluetooth-central</string>' 'xDrip-Watch-App-Info.plist'
          ! grep -q 'WERT ALT' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          python3 - <<'PY'
          from pathlib import Path
          text = Path('xDrip Watch App/DataModels/WatchStateModel.swift').read_text()
          start = text.index('// MARK: - Manual G7 authentication probe')
          end = text.index('// MARK: - Direct G7 BLE manager', start)
          probe = text[start:end]
          required = [
              'testWindowSeconds: TimeInterval = 600',
              'minStableConnectionSeconds: TimeInterval = 0.25',
              'discoverServices([self.serviceUUID])',
              'discoverCharacteristics(nil, for: service)',
              'scheduleRetry("Remote-Disconnect nach',
              'PASSIV-GATT erfolgreich · KEIN Notify · KEIN TX',
          ]
          forbidden = [
              'writeValue(',
              'setNotifyValue(',
              'sendInitialAuthRequest',
              'authRequestSent',
              'packet.append(0x02)',
              'TX F8083535',
          ]
          for token in required:
              assert token in probe, f'missing Build 12 token: {token}'
          for token in forbidden:
              assert token not in probe, f'Build 12 must stay passive; found: {token}'
          print('Build 12 probe block is passive: no Notify, no Write, no Dexcom auth TX.')
          PY
          git diff --check
          echo 'Build 12 10-minute multi-window GATT probe and stale BG safety verified.'

      - name: Show local patch diff
        run: git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build12-artifacts
          path: |
            artifacts
            buildlog
