name: Personal xDrip G7 Watch Build 18
run-name: G7 Watch Build 18 Ultra Full Area (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/apply_g7_watch_build18_ultra_fullarea.py'
      - '.github/workflows/personal_watch_g7_build18_ultra_fullarea.yml'
      - '.github/triggers/build18.trigger'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 18
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Check Build 15-18 patch syntax
        run: |
          python3 -m py_compile .github/scripts/apply_g7_watch_build15_multicycle_validation.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build18_ultra_fullarea.py

      - name: Apply personal Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply Build 7 G7 direct baseline
        run: python3 .github/scripts/apply_g7_watch_ble_diagnostic.py

      - name: Apply manual G7 auth probe and stale BG safety
        run: python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py

      - name: Apply G7 auth disconnect telemetry
        run: python3 .github/scripts/apply_g7_watch_auth_telemetry.py

      - name: Apply Build 11 six-minute G7 discovery
        run: python3 .github/scripts/apply_g7_watch_build11_discovery.py

      - name: Apply Build 12 multi-window connection/GATT probe
        run: python3 .github/scripts/apply_g7_watch_build12_multiwindow.py

      - name: Apply Build 13 name-independent Notify listener
        run: python3 .github/scripts/apply_g7_watch_build13_notify_listener.py

      - name: Apply Build 14 passive BG decoder
        run: python3 .github/scripts/apply_g7_watch_build14_passive_decoder.py

      - name: Apply Build 15 multi-cycle validation
        run: python3 .github/scripts/apply_g7_watch_build15_multicycle_validation.py

      - name: Apply Build 16 rolling complication and update logic
        run: |
          python3 .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 .github/scripts/apply_g7_watch_build16_compile_fixes.py

      - name: Verify Build 16 update architecture
        run: |
          grep -q 'timelineStep: TimeInterval = 5 \* 60' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          grep -q 'staleAfter: TimeInterval = 12 \* 60' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          grep -q 'policy: .atEnd' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          ! grep -q 'policy: .never' 'xDrip Watch Complication/XDripWatchComplication+Provider.swift'
          grep -q 'WidgetCenter.shared.reloadTimelines(ofKind: "xDripWatchComplication")' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'stateChanged || sourceChanged' 'xDrip Watch App/DataModels/WatchStateModel.swift'
          grep -q 'maximumMgDl = 220.0' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'visibleDuration: TimeInterval = 2 \* 60 \* 60' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          grep -q 'let currentTimeX = plotRight' 'xDrip Watch Complication/Views/AccessoryRectangularView.swift'

      - name: Apply Build 17 Ultra layout baseline
        run: python3 .github/scripts/apply_g7_watch_build17_ultra_layout.py

      - name: Apply Build 18 Ultra full-area layout
        run: python3 .github/scripts/apply_g7_watch_build18_ultra_fullarea.py

      - name: Verify Build 18 maximum-area layout
        run: |
          VIEW='xDrip Watch Complication/Views/AccessoryRectangularView.swift'
          WIDGET='xDrip Watch Complication/XDripWatchComplication.swift'
          grep -q '.contentMarginsDisabled()' "$WIDGET"
          grep -q 'geometry.size.width \* 0.18' "$VIEW"
          grep -q 'max(32.0, min(38.0' "$VIEW"
          grep -q 'HStack(alignment: .center, spacing: 0)' "$VIEW"
          grep -q 'size: entry.widgetState.isSmallScreen() ? 16 : 20' "$VIEW"
          grep -q 'HStack(alignment: .firstTextBaseline, spacing: 1)' "$VIEW"
          grep -q 'size: entry.widgetState.isSmallScreen() ? 8 : 9' "$VIEW"
          grep -q 'let leftMargin: CGFloat = size.width < 115 ? 13 : 15' "$VIEW"
          grep -q 'let rightMargin: CGFloat = 0' "$VIEW"
          grep -q 'let topMargin: CGFloat = 0.5' "$VIEW"
          grep -q 'let bottomMargin: CGFloat = size.height < 55 ? 8 : 9' "$VIEW"
          grep -q 'maximumMgDl = 220.0' "$VIEW"
          grep -q 'visibleDuration: TimeInterval = 2 \* 60 \* 60' "$VIEW"
          grep -q 'let currentTimeX = plotRight' "$VIEW"
          ! grep -q 'xDrip Watch App/Views' '.github/scripts/apply_g7_watch_build18_ultra_fullarea.py'
          git diff --check
          echo 'Build 18 verified: WidgetKit margins disabled, full accessoryRectangular area used, narrow value panel, maximum 2h graph width/height, Build 16 refresh/stale logic preserved.'

      - name: Show local patch diff
        run: git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d"

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build18-artifacts
          path: |
            artifacts
            buildlog
