name: Personal xDrip G7 Watch Build 25
run-name: G7 Watch Build 25 Final Ultra + Complications (${{ github.ref_name }})

on:
  push:
    branches:
      - master
    paths:
      - '.github/scripts/apply_g7_watch_build25_final_ultra_complications.py'
      - '.github/workflows/personal_watch_g7_build25_final_ultra_complications.yml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate_secrets.yml
    secrets: inherit

  build:
    name: Build G7 Watch Build 25
    needs: validate
    runs-on: macos-26
    permissions:
      contents: read

    steps:
      - name: Select Xcode version
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive
          ref: master
          token: ${{ secrets.GH_PAT }}

      - name: Check Build 15-25 patch syntax
        run: |
          python3 -m py_compile .github/scripts/apply_g7_watch_build15_multicycle_validation.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build21_single_configurable_complication.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py
          python3 -m py_compile .github/scripts/apply_g7_watch_build25_final_ultra_complications.py

      - name: Apply personal Watch Phase 1 patch
        run: python3 .github/scripts/apply_personal_watch_phase1.py

      - name: Apply G7 direct baseline and diagnostics
        run: |
          python3 .github/scripts/apply_g7_watch_ble_diagnostic.py
          python3 .github/scripts/apply_g7_watch_auth_probe_and_stale_safety.py
          python3 .github/scripts/apply_g7_watch_auth_telemetry.py
          python3 .github/scripts/apply_g7_watch_build11_discovery.py
          python3 .github/scripts/apply_g7_watch_build12_multiwindow.py
          python3 .github/scripts/apply_g7_watch_build13_notify_listener.py
          python3 .github/scripts/apply_g7_watch_build14_passive_decoder.py
          python3 .github/scripts/apply_g7_watch_build15_multicycle_validation.py

      - name: Apply Build 16-21 complication chain
        run: |
          python3 .github/scripts/apply_g7_watch_build16_complication_refresh.py
          python3 .github/scripts/apply_g7_watch_build16_compile_fixes.py
          python3 .github/scripts/apply_g7_watch_build17_ultra_layout.py
          python3 .github/scripts/apply_g7_watch_build18_ultra_fullarea.py
          python3 .github/scripts/apply_g7_watch_build19_split_complications.py
          python3 .github/scripts/apply_g7_watch_build20_complication_registration.py
          python3 .github/scripts/apply_g7_watch_build21_single_configurable_complication.py

      - name: Apply Build 22 graph baseline sizing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'let labelFontSize: CGFloat = size.width >= 150 ? 9.0 : 8.2':
                  'let labelFontSize: CGFloat = size.width >= 150 ? 11.0 : 10.0',
              'let leftMargin: CGFloat = size.width >= 150 ? 24.0 : 22.0':
                  'let leftMargin: CGFloat = size.width >= 150 ? 28.0 : 25.0',
              'let bottomMargin: CGFloat = 17.0':
                  'let bottomMargin: CGFloat = 19.0',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'Axis patch expected one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply Build 22-24 registration and graph chain
        run: |
          python3 .github/scripts/apply_g7_watch_build22_template_registration.py
          python3 .github/scripts/apply_g7_watch_build23_graph_readability.py
          python3 .github/scripts/apply_g7_watch_build24_graph_and_picker_bridge.py

      - name: Apply Build 25 final Ultra and complication options
        run: python3 .github/scripts/apply_g7_watch_build25_final_ultra_complications.py

      - name: Verify Build 25 source architecture
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          widget = Path('xDrip Watch Complication/XDripWatchComplication.swift').read_text(encoding='utf-8')
          assert 'struct XDripWatchComplicationBundle: WidgetBundle' in widget
          assert '.configurationDisplayName("Martin’s xDrip Graph")' in widget
          assert '.configurationDisplayName("xDrip BG mg/dL")' in widget
          assert '.configurationDisplayName("BG Trend + Δ mg/dL")' in widget
          assert 'Build25MinuteRing' in widget
          assert 'ageMinutes: entry.build25AgeMinutes' in widget
          assert 'build25AgeSeconds <= build25StaleAfter' in widget
          assert 'Text(entry.build25BGText)' in widget
          assert 'Text("---")' in widget

          provider = Path('xDrip Watch Complication/XDripWatchComplication+Provider.swift').read_text(encoding='utf-8')
          assert 'private let timelineStep: TimeInterval = 60' in provider
          assert 'private let staleAfter: TimeInterval = 12 * 60' in provider
          assert 'staleAfter + 1' in provider

          graph = Path('xDrip Watch Complication/Views/AccessoryRectangularView.swift').read_text(encoding='utf-8')
          assert 'private let minimumMgDl = 0.0' in graph
          assert 'color = .yellow' in graph
          assert 'level == 160 || level == 70' in graph
          assert 'color = .red' in graph
          assert 'with: .color(.white), lineWidth: 0.85' in graph
          assert 'UnitPoint(x: 1, y: 1)' in graph
          assert 'Color.white.opacity(0.75)' in graph
          assert 'let hourFractions: [CGFloat] = [0.0, 0.5, 1.0]' in graph

          app = Path('xDrip Watch App/xDripWatchApp.swift').read_text(encoding='utf-8')
          for marker in [
              'displayName: "Martin’s xDrip Graph"',
              'displayName: "xDrip BG mg/dL"',
              'displayName: "BG Trend + Δ mg/dL"',
              'kind = "xDripBGComplication"',
              'kind = "xDripTrendComplication"',
              'reloadComplicationDescriptors()'
          ]:
              assert marker in app, marker

          with Path('xDrip-Watch-App-Info.plist').open('rb') as f:
              watch_info = plistlib.load(f)
          assert watch_info['CLKComplicationPrincipalClass'] == '$(PRODUCT_MODULE_NAME).ComplicationController'
          assert 'CLKComplicationFamilyGraphicCircular' in watch_info['CLKComplicationSupportedFamilies']
          assert 'CLKComplicationFamilyGraphicRectangular' in watch_info['CLKComplicationSupportedFamilies']

          print('Build25 source verified: graph + two circular complications + picker descriptors.')
          PY
          git diff --check

      - name: Show local patch diff
        run: git diff --stat

      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true

      - name: Install Project Dependencies
        run: bundle install

      - name: Sync clock
        run: sudo sntp -sS time.windows.com

      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Verify packaged Build 25 watch payload
        run: |
          set -euo pipefail
          IPA_PATH="$(find artifacts . -maxdepth 2 -name 'Xdrip4iOS.ipa' -print -quit)"
          test -n "$IPA_PATH"
          rm -rf /tmp/xdrip-build25-ipa
          mkdir -p /tmp/xdrip-build25-ipa
          unzip -q "$IPA_PATH" -d /tmp/xdrip-build25-ipa

          WATCH_APP="$(find /tmp/xdrip-build25-ipa/Payload -path '*/Watch/*.app' -type d -print -quit)"
          test -n "$WATCH_APP"
          EXT="$(find "$WATCH_APP/PlugIns" -name '*Watch Complication*.appex' -type d -print -quit)"
          test -n "$EXT"

          DISPLAY_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$EXT/Info.plist")"
          EXTENSION_POINT="$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$EXT/Info.plist")"
          test "$DISPLAY_NAME" = 'xDrip'
          test "$EXTENSION_POINT" = 'com.apple.widgetkit-extension'
          /usr/libexec/PlistBuddy -c 'Print :CLKComplicationPrincipalClass' "$WATCH_APP/Info.plist"
          codesign --verify --deep --strict "$WATCH_APP"

          # Diagnostic only: don't block TestFlight for optimized-string differences.
          WATCH_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$WATCH_APP/Info.plist")"
          EXT_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$EXT/Info.plist")"
          strings "$WATCH_APP/$WATCH_EXEC" | egrep 'xDrip\.graph|xDrip\.bg|xDrip\.trend|Martin' | head -20 || true
          strings "$EXT/$EXT_EXEC" | egrep 'xDripWatchComplication|xDripBGComplication|xDripTrendComplication' | head -20 || true
          echo 'Packaged Build 25 Watch payload verified.'

      - name: Fastlane upload to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

      - name: Upload build log, IPA and Symbol artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: personal-watch-g7-build25-artifacts
          path: |
            artifacts
            buildlog
